<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 150" fill="none">
  <defs>
    <radialGradient id="aura1" cx="60%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F5B82E" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#F5B82E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F5B82E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laptopScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2433"/>
      <stop offset="100%" stop-color="#0E121B"/>
    </linearGradient>
    <linearGradient id="goldBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5B82E"/>
      <stop offset="100%" stop-color="#DF9B17"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B0F19" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Ambient Gold Glow -->
  <circle cx="115" cy="70" r="55" fill="url(#aura1)"/>

  <!-- Sparkles -->
  <path d="M72 40 L73.5 45 L78.5 46.5 L73.5 48 L72 53 L70.5 48 L65.5 46.5 L70.5 45 Z" fill="#F5B82E" opacity="0.85"/>
  <path d="M162 65 L163 68 L166 69 L163 70 L162 73 L161 70 L158 69 L161 68 Z" fill="#F5B82E" opacity="0.7"/>

  <!-- Laptop Base Shadow -->
  <ellipse cx="110" cy="122" rx="48" ry="8" fill="#0B0F19" opacity="0.18"/>

  <!-- Laptop Screen Lid (Angled Perspective) -->
  <g filter="url(#shadow1)">
    <!-- Lid Outer Frame -->
    <rect x="74" y="32" width="76" height="58" rx="8" transform="rotate(-6 112 61)" fill="#232A3B" stroke="#3A445C" stroke-width="1.5"/>
    <!-- Screen Display -->
    <rect x="78" y="36" width="68" height="50" rx="5" transform="rotate(-6 112 61)" fill="url(#laptopScreen)"/>
    
    <!-- Screen UI Elements (Rotated with screen) -->
    <g transform="rotate(-6 112 61)">
      <!-- Browser Top Bar -->
      <rect x="82" y="40" width="60" height="7" rx="3.5" fill="#2A344A"/>
      <circle cx="86" cy="43.5" r="1.5" fill="#EF4444"/>
      <circle cx="91" cy="43.5" r="1.5" fill="#F59E0B"/>
      <circle cx="96" cy="43.5" r="1.5" fill="#10B981"/>

      <!-- Hero Banner Wireframe -->
      <rect x="82" y="50" width="36" height="20" rx="4" fill="#323E56"/>
      <!-- Small Mountain Graphic inside Hero -->
      <path d="M86 65 L93 56 L99 63 L104 58 L112 66 Z" fill="#475678"/>
      <circle cx="106" cy="54" r="2.5" fill="#F5B82E" opacity="0.9"/>

      <!-- Right Column Cards -->
      <rect x="122" y="50" width="20" height="9" rx="3" fill="#2A344A"/>
      <rect x="122" y="61" width="20" height="9" rx="3" fill="#2A344A"/>

      <!-- Mouse Cursor -->
      <path d="M114 62 L114 72 L117 69 L120 73 L122 72 L119 68 L123 68 Z" fill="#F5B82E"/>
    </g>
  </g>

  <!-- Laptop Keyboard Base (Perspective Wedge) -->
  <path d="M62 110 L80 90 L148 83 L158 103 Z" fill="#1B2232" stroke="#313C52" stroke-width="1.2"/>
  <path d="M62 110 L158 103 L155 107 L60 114 Z" fill="#121722"/>
  <!-- Trackpad -->
  <polygon points="98,102 122,100 120,105 97,107" fill="#283348"/>

  <!-- Floating Code Badge Pill -->
  <g filter="url(#shadow1)">
    <rect x="132" y="24" width="34" height="20" rx="10" fill="url(#goldBadge)"/>
    <text x="149" y="38" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#080A10" text-anchor="middle" letter-spacing="0.5">&lt;/&gt;</text>
  </g>
</svg>
