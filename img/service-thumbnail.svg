<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 150" fill="none">
  <defs>
    <radialGradient id="aura4" cx="60%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F5B82E" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#F5B82E" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F5B82E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thumbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D1505"/>
      <stop offset="45%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F5B82E"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="12" stdDeviation="10" flood-color="#0B0F19" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Gold Glow -->
  <circle cx="118" cy="74" r="56" fill="url(#aura4)"/>

  <!-- Radiation Marks around Thumbnail -->
  <line x1="68" y1="52" x2="62" y2="48" stroke="#F5B82E" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="44" x2="68" y2="38" stroke="#F5B82E" stroke-width="2" stroke-linecap="round"/>
  <line x1="82" y1="40" x2="80" y2="34" stroke="#F5B82E" stroke-width="2" stroke-linecap="round"/>

  <!-- Sparkles -->
  <path d="M164 68 L165 71 L168 72 L165 73 L164 76 L163 73 L160 72 L163 71 Z" fill="#F5B82E" opacity="0.8"/>
  <path d="M152 38 L153 41 L156 42 L153 43 L152 46 L151 43 L148 42 L151 41 Z" fill="#F5B82E" opacity="0.65"/>

  <!-- Cast Floor Shadow -->
  <ellipse cx="118" cy="126" rx="44" ry="7" fill="#0B0F19" opacity="0.2"/>

  <!-- Floating 3D Tablet Frame -->
  <g filter="url(#shadow4)" transform="rotate(-6 116 76)">
    <!-- Tablet Bezel -->
    <rect x="74" y="42" width="86" height="56" rx="8" fill="#1C222E" stroke="#2E384C" stroke-width="2"/>

    <!-- Screen Area -->
    <rect x="77" y="45" width="80" height="50" rx="6" fill="url(#thumbBg)"/>

    <!-- Mountain Silhouettes -->
    <polygon points="77,88 100,68 116,82 138,62 157,78 157,95 77,95" fill="#111622"/>
    <polygon points="106,78 126,62 142,75 157,66 157,95 106,95" fill="#0A0E17" opacity="0.6"/>

    <!-- Dramatic Typography: CREATE BIGGER -->
    <text x="83" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="900" fill="#FFFFFF" letter-spacing="0.4">CREATE</text>
    <text x="83" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="900" fill="#FFFFFF" letter-spacing="0.4">BIGGER</text>

    <!-- Translucent Center Play Button -->
    <circle cx="128" cy="68" r="9.5" fill="rgba(8, 10, 16, 0.65)" stroke="#F5B82E" stroke-width="1.2"/>
    <polygon points="126,63 133,68 126,73" fill="#F5B82E"/>
  </g>
</svg>
