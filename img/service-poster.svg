<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 150" fill="none">
  <defs>
    <radialGradient id="aura2" cx="60%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F5B82E" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#F5B82E" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F5B82E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="posterSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="50%" stop-color="#F5B82E"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="12" stdDeviation="10" flood-color="#0B0F19" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Gold Glow -->
  <circle cx="118" cy="72" r="56" fill="url(#aura2)"/>

  <!-- Sparkles -->
  <path d="M74 36 L75.5 40 L79.5 41.5 L75.5 43 L74 47 L72.5 43 L68.5 41.5 L72.5 40 Z" fill="#F5B82E" opacity="0.85"/>
  <path d="M160 58 L161 61 L164 62 L161 63 L160 66 L159 63 L156 62 L159 61 Z" fill="#F5B82E" opacity="0.75"/>
  <path d="M152 110 L153 112 L155 113 L153 114 L152 116 L151 114 L149 113 L151 112 Z" fill="#F5B82E" opacity="0.6"/>

  <!-- Floor Soft Cast Shadow -->
  <ellipse cx="120" cy="128" rx="42" ry="7" fill="#0B0F19" opacity="0.18"/>

  <!-- Tilted 3D Framed Poster Artwork -->
  <g filter="url(#shadow2)" transform="rotate(-5 120 75)">
    <!-- Outer Paper Canvas Frame -->
    <rect x="88" y="22" width="64" height="96" rx="6" fill="#FAF6EE" stroke="#E2DAC8" stroke-width="1.8"/>

    <!-- Inner Poster Artwork Area -->
    <rect x="92" y="26" width="56" height="74" rx="4" fill="url(#posterSky)"/>

    <!-- Top Headline: BIGGER DREAMS -->
    <text x="120" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="900" fill="#0B0F19" text-anchor="middle" letter-spacing="0.5">BIGGER</text>
    <text x="120" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="900" fill="#0B0F19" text-anchor="middle" letter-spacing="0.5">DREAMS</text>

    <!-- Glowing Golden Sun Disk -->
    <circle cx="120" cy="62" r="11" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="120" cy="62" r="8" fill="#FDE68A"/>

    <!-- Silhouette Mountain Range -->
    <polygon points="92,86 108,68 122,81 136,65 148,80 148,100 92,100" fill="url(#mountainGrad)"/>
    <polygon points="106,78 120,66 132,79 148,68 148,100 106,100" fill="#111827" opacity="0.6"/>

    <!-- Bottom Metadata Bar -->
    <rect x="92" y="104" width="22" height="4.5" rx="1.5" fill="#0B0F19"/>
    <line x1="120" y1="106.2" x2="144" y2="106.2" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
