<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 150" fill="none">
  <defs>
    <radialGradient id="aura5" cx="60%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F5B82E" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#F5B82E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F5B82E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#28114B"/>
      <stop offset="100%" stop-color="#0E051D"/>
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="12" stdDeviation="10" flood-color="#0B0F19" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Gold Glow -->
  <circle cx="118" cy="74" r="56" fill="url(#aura5)"/>

  <!-- Sparkles -->
  <path d="M72 40 L73.5 44 L77.5 45.5 L73.5 47 L72 51 L70.5 47 L66.5 45.5 L70.5 44 Z" fill="#F5B82E" opacity="0.85"/>
  <path d="M164 54 L165 57 L168 58 L165 59 L164 62 L163 59 L160 58 L163 57 Z" fill="#F5B82E" opacity="0.7"/>

  <!-- Floor Shadow -->
  <ellipse cx="115" cy="126" rx="46" ry="7" fill="#0B0F19" opacity="0.2"/>

  <!-- 3D Video Editor Monitor Console -->
  <g filter="url(#shadow5)" transform="rotate(-5 112 74)">
    <!-- Outer Console Frame -->
    <rect x="74" y="32" width="80" height="66" rx="8" fill="#1C222E" stroke="#2F394D" stroke-width="1.8"/>

    <!-- Top Preview Player Display -->
    <rect x="78" y="36" width="72" height="34" rx="5" fill="#0F1420"/>
    <!-- Video Still Frame -->
    <path d="M86 64 L96 52 L106 60 L118 46 L134 64 Z" fill="#243048"/>
    <circle cx="124" cy="44" r="3.5" fill="#F5B82E" opacity="0.85"/>
    <!-- Small Center Play Icon -->
    <polygon points="112,50 117,53 112,56" fill="#FFFFFF" opacity="0.9"/>

    <!-- Timeline Scrubber Track Divider -->
    <line x1="78" y1="74" x2="150" y2="74" stroke="#2E394E" stroke-width="1.2"/>
    <polygon points="108,71 112,74 108,77" fill="#38BDF8"/>
    <line x1="108" y1="74" x2="108" y2="94" stroke="#38BDF8" stroke-width="1.2"/>

    <!-- Multi-Track Audio & Video Timeline Blocks -->
    <!-- Video Track (Cyan / Teal) -->
    <rect x="80" y="78" width="26" height="6" rx="2" fill="#0EA5E9"/>
    <rect x="108" y="78" width="22" height="6" rx="2" fill="#38BDF8"/>
    <rect x="132" y="78" width="16" height="6" rx="2" fill="#0284C7"/>

    <!-- Audio Track (Purple / Magenta) -->
    <rect x="80" y="86" width="34" height="6" rx="2" fill="#8B5CF6"/>
    <rect x="116" y="86" width="32" height="6" rx="2" fill="#A855F7"/>
  </g>

  <!-- Floating 3D "Pr" Premiere Pro Badge -->
  <g filter="url(#shadow5)">
    <rect x="138" y="88" width="28" height="28" rx="7" fill="url(#prBadge)" stroke="#9333EA" stroke-width="1.5"/>
    <text x="152" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#E9D5FF" text-anchor="middle" letter-spacing="-0.5">Pr</text>
  </g>
</svg>
