<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 150" fill="none">
  <defs>
    <radialGradient id="aura6" cx="60%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F5B82E" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#F5B82E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F5B82E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldRing1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F5B82E"/>
      <stop offset="80%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="goldRing2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="35%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="shadow6" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="12" stdDeviation="12" flood-color="#0B0F19" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Ambient Gold Glow -->
  <circle cx="118" cy="74" r="56" fill="url(#aura6)"/>

  <!-- Sparkles -->
  <path d="M72 44 L73.5 48 L77.5 49.5 L73.5 51 L72 55 L70.5 51 L66.5 49.5 L70.5 48 Z" fill="#F5B82E" opacity="0.85"/>
  <path d="M162 48 L163 51 L166 52 L163 53 L162 56 L161 53 L158 52 L161 51 Z" fill="#F5B82E" opacity="0.75"/>
  <path d="M80 88 L81 90 L83 91 L81 92 L80 94 L79 92 L77 91 L79 90 Z" fill="#F5B82E" opacity="0.6"/>

  <!-- Floor Cast Shadow -->
  <ellipse cx="120" cy="126" rx="42" ry="7" fill="#0B0F19" opacity="0.22"/>

  <!-- Dark Rounded Tile Base -->
  <g filter="url(#shadow6)">
    <rect x="86" y="38" width="66" height="66" rx="20" transform="rotate(8 119 71)" fill="#181D28" stroke="#2D3546" stroke-width="1.8"/>

    <!-- 3D Metallic Golden Torus / Double Ring Spiral Structure -->
    <!-- Lower Ring in Perspective -->
    <ellipse cx="117" cy="81" rx="24" ry="12" fill="none" stroke="url(#goldRing1)" stroke-width="7" stroke-linecap="round" transform="rotate(-18 117 81)"/>
    <ellipse cx="117" cy="81" rx="24" ry="12" fill="none" stroke="#FDE68A" stroke-width="1.8" opacity="0.8" transform="rotate(-18 117 81)"/>

    <!-- Upper Ring in Perspective (Interlocking/Coiling) -->
    <ellipse cx="119" cy="65" rx="22" ry="11" fill="none" stroke="url(#goldRing2)" stroke-width="7" stroke-linecap="round" transform="rotate(-20 119 65)"/>
    <ellipse cx="119" cy="65" rx="22" ry="11" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.85" transform="rotate(-20 119 65)"/>

    <!-- Core Radiant Energy Spark -->
    <circle cx="119" cy="73" r="3" fill="#FFFFFF"/>
    <circle cx="119" cy="73" r="6" fill="#F5B82E" opacity="0.5"/>
  </g>

  <!-- Floating Golden Play Button / Motion Badge -->
  <g filter="url(#shadow6)">
    <rect x="134" y="86" width="28" height="28" rx="8" fill="#151922" stroke="#F5B82E" stroke-width="1.5"/>
    <polygon points="145,95 154,100 145,105" fill="#F5B82E"/>
  </g>
</svg>
